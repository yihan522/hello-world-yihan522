<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hello World - yihan522</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      /* 粉色到绿色的柔和渐变背景 */
      background: linear-gradient(135deg, #ffd6e8 0%, #d4f5e0 100%);
    }

    .card {
      background: #ffffff;
      padding: 48px 56px;
      border-radius: 20px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.12);
      text-align: center;
      max-width: 560px;
    }

    .title {
      font-size: 32px;
      font-weight: 700;
      color: #ff6fa5; /* 粉色标题 */
      margin-bottom: 24px;
      line-height: 1.4;
    }

    .time-box {
      display: inline-block;
      margin-top: 12px;
      padding: 14px 28px;
      background: #e6f9ee;
      border-left: 5px solid #34c77b; /* 绿色装饰条 */
      border-radius: 10px;
    }

    .time-label {
      font-size: 14px;
      color: #888;
      margin-bottom: 6px;
    }

    .time-value {
      font-size: 22px;
      font-weight: 600;
      color: #1fa65a; /* 绿色时间 */
      font-variant-numeric: tabular-nums;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 class="title">Hello World！<br>我是 hello world-yihan522，<br>我的第一个 AI 开发的网站</h1>
    <div class="time-box">
      <div class="time-label">当前服务器时间</div>
      <div class="time-value">__SERVER_TIME__</div>
    </div>
  </div>
</body>
</html>
